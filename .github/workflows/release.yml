name: Publish Android stable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public stable tag to verify and advance
        required: true
        type: string
  release:
    types: [published]
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

concurrency:
  group: android-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && github.repository == 'panda472328/yuyin-music-mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate platform and version
        run: node scripts/release.mjs --validate-version --tag "$RELEASE_TAG"
      - name: Install locked dependencies and SDK
        run: |
          npm ci
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"
          chmod +x android/gradlew
      - name: Test release channel guards
        run: node --test scripts/release.test.mjs
      - name: Prepare existing release signing key in runner temp
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          YUYIN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          YUYIN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: node scripts/ci-signing.mjs
      - name: Run application tests and build signed APK
        env:
          YUYIN_ANDROID_KEYSTORE: ${{ runner.temp }}/yuyin-release-signing.p12
          YUYIN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          YUYIN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: npm run android:build
      - name: Verify APK package, version and upgrade certificate
        run: node scripts/verify-android-release.mjs
      - name: Publish one APK, then advance stable channel
        run: |
          release_version=$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')
          node scripts/release.mjs --publish --tag "$RELEASE_TAG" --artifact "artifacts/Yuyin-Mobile-$release_version.apk"
      - name: Remove temporary signing key
        if: always()
        run: node scripts/ci-signing.mjs --cleanup

  advance-existing-release:
    if: github.repository == 'panda472328/yuyin-music-mobile' && ((github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'android-v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'android-v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Validate released tag against its source versions
        run: node scripts/release.mjs --validate-version --tag "$RELEASE_TAG"
      - name: Require an existing public stable release
        run: |
          release_is_unstable=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')
          if [ "$release_is_unstable" != "false" ]; then
            echo "An existing public stable release is required."
            exit 1
          fi
      - name: Install public APK verification tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Verify existing public APK and advance stable channel
        run: |
          release_version=$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "Yuyin-Mobile-$release_version.apk" --dir artifacts
          node scripts/verify-android-release.mjs
          node scripts/release.mjs --publish --tag "$RELEASE_TAG" --artifact "artifacts/Yuyin-Mobile-$release_version.apk"
